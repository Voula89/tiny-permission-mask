[project]
name = "tiny-permission-mask"
version = "0.1.0"
description = "Checks if a file or directory has the required permission bits, such as group-writable or world-readable."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
